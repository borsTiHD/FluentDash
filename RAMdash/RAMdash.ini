[Rainmeter]
Update=2000
AccurateText=1

[Metadata]
Name=Dash
Author= Mazeby
Information= A Rainmeter skin collection for people with too many screens and a need for some clean system monitoring tools and other various widgets.
Version= 1.0
License= CC BY-NC 

[Variables]
@include=../Variables.inc

;This is only used to get the same border width around the entire widget, it does not have any other visual purpose except this.
[Background]
Meter=Shape
Shape=Rectangle 0,0,360,340 | Fill Color 0,0,0,0 | StrokeWidth 0

;------------------------
;--------PLUGINS---------
;------------------------

[FrostedGlass]
Measure=Plugin
Plugin=FrostedGlass
Type=Acrylic
Corner=Round

;------------------------
;-------MEASURES---------
;------------------------
[measureRAM]
Measure=PhysicalMemory

[measureSWAP]
Measure=SwapMemory

[measureTotalSWAP]
Measure=SwapMemory
Total=1

[measureTotalRam]
Measure=PhysicalMemory
Total=1

[measureRAM%]
Measure=Calc
Formula=(measureRAM / measureTotalRam) * 100
DynamicVariables=1

[measureRAMinstalled]
Measure=Calc
Formula=(measureTotalRAM / 1073741824)

[measureRAMused]
Measure=Calc
Formula=(measureRAM / 1073741824)
DynamicVariables=1

[measureSWAP%]
Measure=Calc
Formula=(measureSWAP / measureTotalSWAP) * 100
DynamicVariables=1

;------------------------------------------------------------------------------------------------------------------
;------------------------------------------------------------------------------------------------------------------RAM Monitoring
;------------------------------------------------------------------------------------------------------------------

[RAMtitle]
Meter=String
MeasureName=measureRAMinstalled
MeasureName2=measureRAMused
Text=RAM: %1 GB installed, %2 GB used
FontFace=#Font#
FontColor=#textColorDark#
FontSize=15
Antialias=1
X=20
Y=20

[BarTitle1]
Meter=String
Text=RAM
Angle=(Rad(-90))
FontFace=#Font#
StringAlign=LeftCenter
FontColor=#textColorDark#
FontSize=12
Antialias=1
X=268
Y=320

[BarTitle2]
Meter=String
Text=SWAP
Angle=(Rad(-90))
FontFace=#Font#
StringAlign=LeftCenter
FontColor=#textColorDark#
FontSize=12
Antialias=1
X=309
Y=320

[RAM%]
Meter=String
MeasureName=measureRAM%
FontFace=#Font#
;NumOfDecimals=2
Text=%1%
FontColor=#textColor#
FontSize=10
Antialias=1
X=265
Y=65

[SWAP%]
Meter=String
MeasureName=measureSWAP%
FontFace=#Font#
;NumOfDecimals=2
Text=%1%
FontColor=#textColorDark#
FontSize=10
Antialias=1
X=305
Y=65

[RAMgraphBackground]
Meter=Image
X=20
Y=70
W=220
H=240
SolidColor=#barBGColor#

[RamGraph]
Meter=Line
MeasureName=measureSWAP
MeasureName2=measureRAM
LineColor=255,255,255,100
LineColor2=255,255,255
LineCount=2
HorizontalLineColor=255,255,255,100
AntiAlias=1
X=20
Y=70
W=220
H=240

[RamBar]
Meter=Bar
MeasureName=measureRAM
BarOrientation=Vertical
BarColor=255,255,255,255
X=265
Y=105
H=150
W=25

[RamBar2]
Meter=Bar
MeasureName=measureSWAP
BarOrientation=Vertical
BarColor=255,255,255,100
X=305
Y=105
H=150
W=25