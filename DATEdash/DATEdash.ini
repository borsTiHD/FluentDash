[Rainmeter]
Update=30000
AccurateText=1

[Metadata]
Name=Dash
Author= Mazeby
Information= A Rainmeter skin collection for people with too many screens and a need for some clean system monitoring tools and other various widgets.
Version= 1.0
License= CC BY-NC 

;-- Load in the variables from file --
[Variables]
@include=../Variables.inc

[Background]
;This is only used to get the same border width around the entire widget, it does not have any other visual purpose except this.
Meter=Shape
Shape=Rectangle 0,0,520,120 | Fill Color 0,0,0,0 | StrokeWidth 0

;------------------------
;--------PLUGINS---------
;------------------------

[FrostedGlass]
Measure=Plugin
Plugin=FrostedGlass
Type=Acrylic
Corner=Round

;------------------------
;-------MEASURES---------
;------------------------

[measureDay]
Measure=Time
Format=%A

[measureDate]
Measure=Time
Format=%d.%m.%Y

[measureTime]
Measure=Time
Format=%H:%M

;------------------------------------------------------------------------------------------------------------------
;------------------------------------------------------------------------------------------------------------------Time And Date
;------------------------------------------------------------------------------------------------------------------

[DayAndDate]
Meter=String
MeasureName=measureDay
MeasureName2=measureDate
FontFace=#Font#
FontColor=#textColor#
FontSize=25
Antialias=1
Text=It is %1, the %2
X=20
Y=20


[Time]
Meter=String
MeasureName=measureTime
FontFace=#Font#
FontColor=#textColor#
FontSize=36
Antialias=1
Text=Current time: %1
X=20
Y=50
