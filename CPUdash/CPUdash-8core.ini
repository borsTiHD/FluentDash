; Measure PowerPlan
; - https://forum.rainmeter.net/viewtopic.php?t=145
[measurePowerPlanActiveScheme]
DynamicVariables=1
Measure=Registry
RegHKey=HKEY_LOCAL_MACHINE
RegKey=SYSTEM\ControlSet001\Control\Power\User\PowerSchemes
RegValue=ActivePowerScheme
UpdateDivider=5

[measurePowerPlanActiveSchemeName]
DynamicVariables=1
Measure=Registry
RegHKey=HKEY_LOCAL_MACHINE
RegKey=SYSTEM\ControlSet001\Control\Power\User\PowerSchemes\[measurePowerPlanActiveScheme]
RegValue=FriendlyName
RegExpSubstitute=1
Substitute="^(.*,-\d*,)(.*)$":"\2"
UpdateDivider=5

