[Rainmeter]
Update=2000
AccurateText=1

[Metadata]
Name=Dash
Author= Mazeby
Information= A Rainmeter skin collection for people with too many screens and a need for some clean system monitoring tools and other various widgets.
Version= 1.0
License= CC BY-NC

;-- Load in the variables from file --
[Variables]
@include=../Variables.inc

[Background]
;This is only used to get the same border width around the entire widget, it does not have any other visual purpose except this.
Meter=Shape
Shape=Rectangle 0,0,1283,340 | Fill Color 0,0,0,0 | StrokeWidth 0

;------------------------
;--------PLUGINS---------
;------------------------

[FrostedGlass]
Measure=Plugin
Plugin=FrostedGlass
Type=Acrylic
Corner=Round

[CoreTempSpeed]
Measure=Plugin
Plugin=CoreTemp
CoreTempType=CpuSpeed

;------------------------
;-------MEASURES---------
;------------------------

[measureCPUavg]
Measure=Plugin
Plugin=HWiNFO.dll
HWiNFOSensorId=#HWiNFO-CPU-SensorId#
HWiNFOSensorInstance=#HWiNFO-CPU-SensorInstance#
HWiNFOEntryId=#HWiNFO-CPU-Usage#
HWiNFOType=CurrentValue
MinValue=0
MaxValue=100
IfCondition=(measureCPUavg < #YellowStarts#)
IfTrueAction=[!SetVariable CPUavgColor #GreenColor#]
IfCondition2=(measureCPUavg >= #YellowStarts#) && (measureCPUavg < #RedStarts#)
IfTrueAction2=[!SetVariable CPUavgColor #YellowColor#]
IfCondition3=(measureCPUavg >= #RedStarts#)
IfTrueAction3=[!SetVariable CPUavgColor #RedColor#]

