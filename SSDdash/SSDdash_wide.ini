BarOrientation=#barOrientation#
BarColor=#highlightColor#
H=#barHeight#
W=#barLength#
X=#barX#
Y=#barY#
AntiAlias=1
SolidColor=#barBGColor#

[Drive5Percentage]
Meter=String
MeasureName=MeasureDrive5
Percentual=1
X=#percentageX#
Y=#percentageY#
StringAlign=Right
Text="%1%"
FontColor=#textColor#
FontFace=#Font#
FontSize=#fontSize#
AntiAlias=1

[Drive5GB]
Meter=String
MeasureName=MeasureDrive5Free
FontColor=#textColor#
X=#gbLabelX#
Y=#gbLabelY#
AntiAlias=1
Text="%1 GB free"
NumOfDecimals=0
Scale=1073741824

[Drive5Status]
Meter=String
MeasureName=MeasureDrive5Life
MeasureName2=MeasureDrive5Temp
MeasureName3=MeasureDrive5Warning
MeasureName4=MeasureDrive5Failure
X=#lifeX#
Y=#lifeY#
Text='Life: %1% - Temp: %2°C - Error: %3 / %4'
FontColor=#textColorDark#
FontFace=#Font#
FontSize=#fontSizeSmaller#
AntiAlias=1

[Drive5ReadWrite]
Meter=String
MeasureName=MeasureDrive5Read
MeasureName2=MeasureDrive5Write
X=#readWriteX#
Y=#readWriteY#
Text='Read: %1 MB/s - Write: %2 MB/s'
FontColor=#textColorDark#
FontFace=#Font#
FontSize=#fontSizeSmaller#
AntiAlias=1

