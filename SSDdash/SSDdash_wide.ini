;------------------------
;--------DRIVES----------
;------------------------

;-- Drive 1 --

[Drive1Label]
Meter=String
X=#row1X#
Y=#row1Y#
Text=#D1#\
FontColor=#textColor#
FontFace=#Font#
FontSize=#fontSize#
AntiAlias=1

[Drive1Meter]
Meter=Bar
MeasureName=MeasureDrive1
BarOrientation=#barOrientation#
BarColor=#highlightColor#
H=#barHeight#
W=#barLength#
X=#barX#
Y=#barY#
AntiAlias=1
SolidColor=#barBGColor#

[Drive1Percentage]
Meter=String
MeasureName=MeasureDrive1
Percentual=1
X=#percentageX#
Y=#percentageY#
StringAlign=Right
Text="%1%"
FontColor=#textColor#
FontFace=#Font#
FontSize=#fontSize#
AntiAlias=1

[Drive1GB]
Meter=String
MeasureName=MeasureDrive1Free
FontColor=#textColor#
X=#gbLabelX#
Y=#gbLabelY#
AntiAlias=1
Text="%1 GB free"
NumOfDecimals=0
Scale=1073741824

[Drive1Status]
Meter=String
MeasureName=MeasureDrive1Life
MeasureName2=MeasureDrive1Temp
MeasureName3=MeasureDrive1Warning
MeasureName4=MeasureDrive1Failure
X=#lifeX#
Y=#lifeY#
Text='Life: %1% - Temp: %2°C - Error: %3 / %4'
FontColor=#textColorDark#
FontFace=#Font#
FontSize=#fontSizeSmaller#
AntiAlias=1

[Drive1ReadWrite]
Meter=String
MeasureName=MeasureDrive1Read
MeasureName2=MeasureDrive1Write
X=#readWriteX#
Y=#readWriteY#
Text='Read: %1 MB/s - Write: %2 MB/s'
FontColor=#textColorDark#
FontFace=#Font#
FontSize=#fontSizeSmaller#
AntiAlias=1

