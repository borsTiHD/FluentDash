[Rainmeter]
Update=300000
AccurateText=1

[Metadata]
Name=Dash
Author= borsTiHD
Information= A Rainmeter skin collection for people with too many screens and a need for some clean system monitoring tools and other various widgets.
Version= 1.0
License= CC BY-NC 

;-- Load in the variables from file --
[Variables]
@include=../Variables.inc

;This is only used to get the same border width around the entire widget, it does not have any other visual purpose except this.
[Background]
Meter=Shape
Shape=Rectangle 0,0,350,700 | Fill Color 0,0,0,0 | StrokeWidth 0

;------------------------
;--------PLUGINS---------
;------------------------

[FrostedGlass]
Measure=Plugin
Plugin=FrostedGlass
Type=Acrylic
Corner=Round

;------------------------
;-------MEASURES---------
;------------------------

;-- Drive 1 --

[MeasureDrive1]
Measure=FreeDiskSpace
Drive=#D1#
InvertMeasure=1
UpdateDivider=5
[MeasureDrive1Free]
Measure=FreeDiskSpace
Drive=#D1#
UpdateDivider=5
[MeasureDrive1Life]
Measure=Plugin
Plugin=HWiNFO.dll
HWiNFOSensorId=#HWiNFO-SSD950-512GB-SensorId#
HWiNFOSensorInstance=#HWiNFO-SSD950-512GB-SensorInstance#
HWiNFOEntryId=#HWiNFO-SSD950-512GB-Life#
