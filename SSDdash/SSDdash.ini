;------------------------
;---------TEXT-----------
;------------------------

[HeadlineText]
Meter=String
FontFace=#Font#
Text=Drives
FontColor=#textColorDark#
FontSize=15
Antialias=1
X=20
Y=20

;------------------------
;--------DRIVES----------
;------------------------

;-- Drive 1 --

[Drive1Meter]
Meter=Bar
MeasureName=MeasureDrive1
BarOrientation=Horizontal
BarColor=#highlightColor#
H=#barHeight#
W=#barLength#
X=#barX#
Y=30r
AntiAlias=1
SolidColor=#barBGColor#

[Drive1Label]
Meter=String
X=#labelX#
Y=#labelY#
Text=#D1#\
FontColor=#textColor#
FontFace=#Font#
FontSize=#fontSize#
AntiAlias=1

[Drive1Percentage]
Meter=String
MeasureName=MeasureDrive1
Percentual=1
X=#percentageX#
Y=#percentageY#
StringAlign=Right
Text="%1%"
FontColor=#textColor#
FontFace=#Font#
FontSize=#fontSize#
AntiAlias=1

[Drive1GB]
Meter=String
MeasureName=MeasureDrive1Free
FontColor=#textColor#
H=#gbLabelHeight#
W=#gbLabelLength#
X=#gbLabelX#
Y=#gbLabelY#
AntiAlias=1
Text="%1GB free"
NumOfDecimals=2
Scale=1073741824

[Drive1Status]
Meter=String
MeasureName=MeasureDrive1Life
MeasureName2=MeasureDrive1Temp
MeasureName3=MeasureDrive1Warning
MeasureName4=MeasureDrive1Failure
X=#lifeX#
Y=#lifeY#
Text='Life: %1% - Temp: %2°C - Error: %3 / %4'
FontColor=#textColorDark#
FontFace=#Font#
FontSize=#fontSizeSmaller#
AntiAlias=1

